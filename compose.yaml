services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: faq
      POSTGRES_USER: faq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faq_local}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faq -d faq"]
      interval: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["127.0.0.1:56333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
  api:
    profiles: [app]
    build: .
    command: ["uvicorn", "faq.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment: &app_env
      DATABASE_URL: postgresql://faq:${POSTGRES_PASSWORD:-faq_local}@postgres:5432/faq
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /app/.cache/huggingface
      EMBEDDING_DEVICE: cpu
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FAQ_API_URL: http://api:8000
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["modelcache:/app/.cache", "./data:/app/data", "./evaluation:/app/evaluation"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
  bot:
    profiles: [bot]
    build: .
    command: ["faq", "bot"]
    environment: *app_env
    depends_on: [api]
volumes:
  pgdata:
  qdrantdata:
  modelcache:
